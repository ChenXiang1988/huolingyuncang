<main>
<div class="head">
<h1>个人中心</h1>
</div>
<div class="wrap">

<div class="card">
<h2>账号<span class="hint">由本端管理员建档，本人不可改</span></h2>
<div class="body">
<div class="kv"><span class="k">登录名</span><span class="v">zhangsan</span></div>
<div class="kv"><span class="k">姓名</span><span class="v">张三</span></div>
<div class="kv"><span class="k">所属货主主体</span><span class="v">某某电商（上海）有限公司</span></div>
<div class="kv"><span class="k">所属角色</span><span class="v">货主管理者</span></div>
<div class="kv"><span class="k">状态</span><span class="v"><span class="tag green">启用</span></span></div>
<div class="kv"><span class="k">最近登录</span><span class="v">2026-09-26 12:04 · 本机</span></div>
</div>
</div>

<div class="card">
<h2>联系方式</h2>
<div class="body">
<form id="meForm" class="form" onsubmit="return false">
<div class="field">
<label for="fPhone">手机</label>
<input class="in" id="fPhone" name="phone" type="tel" inputmode="numeric" maxlength="11" pattern="1[3-9][0-9]{9}" placeholder="选填，11 位手机号">
</div>
<div class="field">
<label for="fMail">邮箱</label>
<input class="in" id="fMail" name="mail" type="email" maxlength="128" placeholder="选填">
</div>
</form>
<div class="btns">
<button class="btn primary" type="submit" form="meForm" style="font-family:inherit">保存</button>
</div>
</div>
</div>

<div class="card">
<h2>密码与安全</h2>
<div class="body">
<div class="kv"><span class="k">密码重置</span><span class="v">不提供自助重置</span></div>
<div class="kv"><span class="k">重置方式</span><span class="v">联系本端管理员</span></div>
<div class="kv"><span class="k">连续输错</span><span class="v">5 次临时锁定 30 秒</span></div>
</div>
</div>

</div>
